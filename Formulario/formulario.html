<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Completo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>Formulário Completo</h1>

        <form>

            <fieldset>
                <legend>Dados Pessoais</legend>

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome">

                <label for="sobrenome">Sobrenome:</label>
                <input type="text" id="sobrenome" name="sobrenome">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone">

                <label for="nascimento">Data de Nascimento:</label>
                <input type="date" id="nascimento" name="nascimento">
            </fieldset>

            <fieldset>
                <legend>Endereço</legend>

                <label for="rua">Rua:</label>
                <input type="text" id="rua" name="rua">

                <label for="numero">Número:</label>
                <input type="number" id="numero" name="numero">

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade">

                <label for="estado">Estado:</label>
                <input type="text" id="estado" name="estado">

                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep">
            </fieldset>

            <fieldset>
                <legend>Preferências</legend>

                <label for="cor">Cor Favorita:</label>
                <select id="cor" name="cor">
                    <option value="azul">Azul</option>
                    <option value="verde">Verde</option>
                    <option value="vermelho">Vermelho</option>
                    <option value="roxo">Roxo</option>
                </select>

                <p>Gênero:</p>

                <label>
                    <input type="radio" name="genero" value="masculino">
                    Masculino
                </label>

                <label>
                    <input type="radio" name="genero" value="feminino">
                    Feminino
                </label>

                <p>Interesses:</p>

                <label>
                    <input type="checkbox" name="interesses" value="esportes">
                    Esportes
                </label>

                <label>
                    <input type="checkbox" name="interesses" value="musica">
                    Música
                </label>

                <label>
                    <input type="checkbox" name="interesses" value="tecnologia">
                    Tecnologia
                </label>
            </fieldset>

            <fieldset>
                <legend>Upload de Arquivos</legend>

                <label for="arquivo">Escolha um arquivo:</label>
                <input type="file" id="arquivo" name="arquivo">
            </fieldset>

            <fieldset>
                <legend>Informações de Login</legend>

                <label for="usuario">Nome de Usuário:</label>
                <input type="text" id="usuario" name="usuario">

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha">

                <label for="confirmar">Confirmar Senha:</label>
                <input type="password" id="confirmar" name="confirmar">
            </fieldset>

            <button type="submit">Enviar</button>

        </form>

    </main>

</body>
</html>
