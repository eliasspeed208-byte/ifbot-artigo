<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pet - Hotel Pet</title>
    <link rel="stylesheet" href="stylehp.css">
</head>
<body>
    <header>
        <h1>Hotel Pet</h1>
        <p>Sistema de gerenciamento de estadia de Pets</p>
    </header>

    <main>
        <section>
            <h2>Cadastro de Pet</h2>

            <form>
                <label for="nome">Nome do Pet:</label>
                <input type="text" id="nome" name="nome" required>

                <br><br>

                <label for="especie">Espécie:</label>
                <select id="especie" name="especie" required>
                    <option value="">Selecione</option>
                    <option value="cachorro">Cachorro</option>
                    <option value="gato">Gato</option>
                    <option value="outro">Outro</option>
                </select>

                <br><br>

                <label for="raca">Raça:</label>
                <input type="text" id="raca" name="raca">

                <br><br>

                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" min="0">

                <br><br>

                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso" name="peso" min="0" step="0.1">

                <br><br>

                <label for="sexo">Sexo:</label>
                <select id="sexo" name="sexo">
                    <option value="">Selecione</option>
                    <option value="macho">Macho</option>
                    <option value="femea">Fêmea</option>
                </select>

                <br><br>

                <label for="observacoes">Observações:</label>
                <textarea id="observacoes" name="observacoes" rows="4"></textarea>

                <br><br>

                <button type="submit">Cadastrar Pet</button>
            </form>

            <p><a href="index.html">Voltar</a></p>
        </section>
    </main>
</body>
</html>
