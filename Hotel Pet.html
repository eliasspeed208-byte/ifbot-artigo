<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Login</title>
</head>

<body>

    <header>
        <h1>Hotel Pet</h1>
    </header>

    <main>
        <section>
            <h2>Login</h2>

            <form>
                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <br><br>

                <label for="senha">Senha:</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <br><br>

                <a href="reservas.html">Entrar</a>
            </form>

            <p>
                Ainda não possui uma conta?
                <a href="usuario.html">Criar conta</a>
            </p>
        </section>
    </main>

</body>

</html>
